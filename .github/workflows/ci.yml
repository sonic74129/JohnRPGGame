name: CI

on:
  push:
  pull_request:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: npm ci
      - run: npm test
      - run: npm run build

  validate-pr-static:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact trusted base without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
          persist-credentials: false
      - name: Check out the exact pull request head as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: story-data
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Run dependency-free structural checks
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted-base rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git -C story-data rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          for checkout in trusted-base story-data; do
            if git -C "$checkout" config --local --get-regexp \
              'http\..*\.extraheader|credential\.' >/dev/null; then
              echo "$checkout persisted credentials unexpectedly." >&2
              exit 1
            fi
          done
          if find story-data -path story-data/.git -prune -o \
            -type l -print -quit | grep -q .; then
            echo "Pull request checkout contains a symbolic link." >&2
            exit 1
          fi
          node trusted-base/.github/scripts/validate-story-structure.mjs \
            --story-root story-data
